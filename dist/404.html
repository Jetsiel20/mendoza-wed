<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#101E31">
  <title>Página não encontrada | MENDOZA</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .not-found {
      display: grid;
      min-height: 70svh;
      place-content: center;
      padding-block: 4rem;
    }

    .not-found p.not-found__code {
      margin-bottom: 0.75rem;
      color: var(--blue);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .not-found h1 {
      max-width: 12ch;
      margin-bottom: 1rem;
      font-size: clamp(2.5rem, 10vw, 4rem);
    }

    .not-found p {
      max-width: 34rem;
      margin-bottom: 1.5rem;
      color: var(--muted);
    }

    .not-found .button {
      width: fit-content;
    }
  </style>
</head>
<body>
  <main class="container not-found">
    <p class="not-found__code">Erro 404</p>
    <h1>Esta página não foi encontrada.</h1>
    <p>O endereço pode estar incorreto ou a página pode ter mudado. Volte ao início para conhecer os serviços da MENDOZA.</p>
    <a class="button button--primary" href="index.html">Voltar ao início <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
